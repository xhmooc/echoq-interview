name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  client:
    name: 客户端脚本语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 语法检查
        run: |
          node --check main.js
          node --check preload.js
          for f in src/main/*.js src/renderer/*.js tools/*.js; do node --check "$f"; done
