    <a class="brand" href="/">
      <img class="brand-logo" src="/assets/interview.svg?v=20261120p" alt="" />

      <a class="btn btn-primary btn-sm" href="/#download">下载 Windows 版</a>
    </div>
  </div>
</header>

<main>
  <section class="account-hero">
    <div class="container account-grid">
      <div class="account-copy">
        <div class="eyebrow"><span class="pulse"></span>账号中心</div>
        <h1>登录账号，<br />开始使用</h1>
        <p>EchoQ 与客户端共用同一账号，登录后即可使用。</p>
        <div class="account-points">
          <div class="account-point"><span class="tick">✓</span><span><b>功能开放</b>面试、笔试和手机副屏均可使用。</span></div>
          <div class="account-point"><span class="tick">✓</span><span><b>数据留在本机</b>简历、模型和记录保存在电脑上。</span></div>
        </div>
      </div>

      <div class="auth-card" id="auth-card">
        <!-- 未登录 -->
        <div id="auth-view">
          <div class="auth-tabs" role="tablist">
            <button class="auth-tab active" data-mode="login" type="button">登录</button>
            <button class="auth-tab" data-mode="register" type="button">注册</button>
          </div>
          <form id="auth-form" novalidate>
            <div class="field">
              <label for="email">邮箱</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
              <label for="password">密码</label>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="至少 6 位" minlength="6" required />
              <div class="hint" id="password-hint" hidden>注册密码至少 6 位，最长 72 位。</div>
            </div>
            <button class="btn btn-primary auth-submit" id="auth-submit" type="submit">登录</button>
            <div class="auth-error" id="auth-error"></div>
            <p class="auth-note">登录或注册即表示同意 <a href="/terms.html" style="color:var(--mint-deep)">服务条款</a> 与 <a href="/privacy.html" style="color:var(--mint-deep)">隐私政策</a></p>
          </form>
        </div>

        <!-- 已登录 -->
        <div id="account-view" hidden>
          <div class="account-balance">
            <div class="account-email" id="account-email">—</div>
            <div class="balance-num" id="balance-minutes">0</div>
            <div class="balance-unit" id="balance-unit">分钟剩余</div>
            <div class="balance-sub" id="balance-sub">按实际使用秒数扣减</div>
          </div>

          <div id="redeem-block">
            <div class="field">
              <label for="redeem-code">兑换时长码</label>
              <div class="redeem-row">
                <input id="redeem-code" type="text" placeholder="例如 ABCD-EFGH-1234" autocomplete="off" spellcheck="false" />
                <button class="btn btn-primary" id="redeem-btn" type="button">兑换</button>
              </div>
              <div class="hint" id="redeem-hint">时长码不区分大小写，兑换后立即到账。</div>
            </div>
          </div>

          <div class="account-actions">
            <button class="btn btn-ghost" id="refresh-btn" type="button">刷新状态</button>
            <button class="btn btn-ghost" id="logout-btn" type="button">退出登录</button>
          </div>
          <div class="auth-error" id="account-error"></div>
        </div>
      </div>
    </div>
  </section>
</main>
