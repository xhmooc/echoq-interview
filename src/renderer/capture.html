<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>框选题目</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
  #shot {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill;
    pointer-events: none; -webkit-user-drag: none; user-select: none;
  }
  #sel {
    position: fixed; display: none; border: 1px solid #34d399; background: transparent;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); pointer-events: none;
  }
  #size {
    position: fixed; display: none; padding: 3px 7px; border-radius: 5px;
    background: rgba(15, 23, 42, 0.9); color: #d1fae5; font: 11px/1.4 "Microsoft YaHei", sans-serif;
    pointer-events: none; white-space: nowrap;
  }
  #hint {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; background: rgba(15, 23, 42, 0.86);
    color: #cbd5e1; font: 12px/1.4 "Microsoft YaHei", sans-serif; pointer-events: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  #bar {
    position: fixed; display: none; gap: 6px; padding: 6px; border-radius: 9px;
    background: rgba(15, 23, 42, 0.94); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    align-items: center;
  }
  #bar button {
    border: 0; border-radius: 6px; padding: 5px 12px; font: 12px/1.4 "Microsoft YaHei", sans-serif;
    cursor: pointer; color: #cbd5e1; background: rgba(255, 255, 255, 0.08);
  }
  #bar button.ok { background: #34d399; color: #052e1c; font-weight: 600; }
  #bar button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <img id="shot" alt="" draggable="false" />
  <div id="sel"></div>
  <div id="size"></div>
  <div id="hint">拖动框选题目 · Enter 确认 · Esc / 右键取消</div>
  <div id="bar">
    <button id="btnCancel" type="button">取消</button>
    <button id="btnOk" class="ok" type="button">确定</button>
  </div>
  <script src="capture.js"></script>
</body>
</html>
