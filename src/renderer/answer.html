<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>笔试答案</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0e1118; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #e5e7eb;
  }
  .card {
    height: 100%; display: flex; flex-direction: column;
    background: #0e1118;
  }
  .head {
    flex: 0 0 34px; display: flex; align-items: center; gap: 8px;
    padding: 0 8px 0 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    -webkit-app-region: drag;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
  .title { font-size: 11.5px; font-weight: 600; letter-spacing: .3px; color: #cbd5e1; }
  .provider { font-size: 10px; color: #6b7280; }
  .actions { margin-left: auto; display: flex; gap: 2px; -webkit-app-region: no-drag; }
  .actions button {
    border: 0; border-radius: 5px; background: transparent; color: #8b93a5;
    font: 11px/1 "Microsoft YaHei", sans-serif; padding: 5px 7px; cursor: pointer;
  }
  .actions button:hover { background: rgba(255, 255, 255, 0.08); color: #d1d5db; }
  .body { flex: 1; overflow-y: auto; padding: 10px 12px 14px; }
  details { margin-bottom: 8px; }
  summary { font-size: 10.5px; color: #7f8899; cursor: pointer; }
  .ocr {
    margin-top: 6px; padding: 7px 8px; border-radius: 7px;
    background: rgba(255, 255, 255, 0.04); color: #9aa3b2;
    font-size: 11px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    max-height: 96px; overflow-y: auto;
  }
  .answer {
    font-size: 13px; line-height: 1.68; white-space: pre-wrap; word-break: break-word;
    color: #f3f4f6;
  }
  .empty { color: #6b7280; font-size: 12px; }
  .foot {
    flex: 0 0 38px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-top: 1px solid rgba(255, 255, 255, 0.07);
    -webkit-app-region: no-drag;
  }
  .capture {
    flex: 1; height: 26px; border: 0; border-radius: 6px; cursor: pointer;
    background: #34d399; color: #052e1b; font: 600 11.5px/1 "Microsoft YaHei", sans-serif;
  }
  .capture:hover { background: #4ade80; }
  .capture:disabled { opacity: .55; cursor: default; }
  .hint { font-size: 10px; color: #6b7280; white-space: nowrap; }
  .grip {
    position: fixed; right: 0; bottom: 0; width: 16px; height: 16px;
    cursor: nwse-resize; -webkit-app-region: no-drag; z-index: 2;
  }
  .grip::after {
    content: ""; position: absolute; right: 3px; bottom: 3px; width: 8px; height: 8px;
    border-right: 2px solid rgba(255, 255, 255, 0.28);
    border-bottom: 2px solid rgba(255, 255, 255, 0.28);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="dot"></span>
      <span class="title">笔试答案</span>
      <span class="provider" id="provider"></span>
      <div class="actions">
        <button id="btnCopy" type="button" title="复制答案">复制</button>
        <button id="btnHide" type="button" title="隐藏（Alt+Shift+S）">✕</button>
      </div>
    </div>
    <div class="body">
      <details>
        <summary>识别到的题目</summary>
        <div class="ocr" id="ocr"></div>
      </details>
      <div class="answer" id="answer"><span class="empty">等待截图…</span></div>
    </div>
    <div class="foot">
      <button class="capture" id="btnCapture" type="button">截下一题</button>
      <span class="hint" id="hint">Alt+Shift+A</span>
    </div>
  </div>
  <div class="grip" id="grip" title="拖动调整大小"></div>
  <script src="answer.js"></script>
</body>
</html>
